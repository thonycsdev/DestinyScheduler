name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Database tests start postgres:18 with testcontainers; the runner has Docker.
      - run: go test ./...

  migrate:
    # Only after tests pass on a push to master, never on pull requests.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # DATABASE_URL is a secret of the PRD environment, not of the repository.
    environment: PRD
    # One migration run at a time; a newer push waits instead of cancelling.
    concurrency:
      group: migrate-database
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret is not set in the PRD environment."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./cmd/migrate up
      - run: go run ./cmd/migrate status
