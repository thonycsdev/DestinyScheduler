name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Database tests start postgres:18 with testcontainers; infra tests use
      # the runner's shellcheck. CI=true makes the shellcheck test mandatory.
      - run: go test ./...
      - name: cfn-lint
        run: pipx run cfn-lint --regions us-east-1 -- infra/*.yml
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

  # Pull requests: make sure the production image still builds.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/arm64 -t destiny-bot:pr .

  # Pushes to master, after tests pass:
  # infrastructure -> migrations -> image -> release.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Native ARM runner for the linux/arm64 image (free for public repos).
    runs-on: ubuntu-24.04-arm
    environment: PRD
    # One deploy at a time; a newer push waits instead of cancelling.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # GitHub OIDC -> AWS deploy role
      contents: read
    env:
      AWS_REGION: us-east-1
      STACK: destiny-scheduler-app
      ASG: destiny-scheduler-bot
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Require AWS_DEPLOY_ROLE_ARN
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::Set the AWS_DEPLOY_ROLE_ARN variable of the PRD environment (bootstrap stack output DeployRoleArn)."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy infrastructure
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file infra/app.yml \
            --role-arn "arn:aws:iam::$account:role/destiny-scheduler-cfn-exec" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Migrate database
        run: |
          url=$(aws secretsmanager get-secret-value --secret-id destiny-scheduler/database-url --query SecretString --output text)
          if [ "$url" = set-me ]; then
            echo "::error::Set the database URL: aws secretsmanager put-secret-value --secret-id destiny-scheduler/database-url --secret-string '<url>'"
            exit 1
          fi
          echo "::add-mask::$url"
          export DATABASE_URL="$url"
          go run ./cmd/migrate up
          go run ./cmd/migrate status

      - name: Build and push image
        run: |
          repo=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" --output text)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repo%%/*}"
          docker build --platform linux/arm64 -t "$repo:$IMAGE_TAG" .
          docker push "$repo:$IMAGE_TAG"

      - name: Release
        run: |
          aws ssm put-parameter --name /destiny-scheduler/image-tag --value "$IMAGE_TAG" --type String --overwrite >/dev/null
          instance=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" --output text)
          if [ -z "$instance" ] || [ "$instance" = None ]; then
            echo "::notice::No instance in service right now; the next one starts image $IMAGE_TAG on boot."
            exit 0
          fi
          # Restart, then require the service to still be running 20s later
          # (a crashing bot is in "activating (auto-restart)" by then).
          command=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --parameters 'commands=["systemctl restart destiny-bot","sleep 20","systemctl is-active destiny-bot"]' \
            --query Command.CommandId --output text)
          if ! aws ssm wait command-executed --command-id "$command" --instance-id "$instance"; then
            aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query '{status: Status, stdout: StandardOutputContent, stderr: StandardErrorContent}'
            echo "::error::The bot didn't stay running after the restart. Check the /destiny-scheduler/bot logs."
            exit 1
          fi
          echo "Released $IMAGE_TAG to $instance."
